<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devika Jain | Portfolio</title>
  <meta name="description" content="Portfolio website for Devika Jain" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a2d;
      --panel: #1b2438;
      --panel-2: #0f172a;
      --text: #edf2ff;
      --muted: #a7b1c2;
      --primary: #7c3aed;
      --primary-2: #22c55e;
      --accent: #f59e0b;
      --white: #ffffff;
      --shadow: 0 18px 40px rgba(0,0,0,0.25);
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #0d1321 100%);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-alt {
      background: rgba(255,255,255,0.02);
    }

    .eyebrow {
      color: var(--primary-2);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .section-heading {
      margin-bottom: 42px;
    }

    .section-heading h3 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 16, 32, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      color: var(--muted);
    }

    .nav-links a:hover,
    .footer-links a:hover {
      color: var(--white);
    }

    .nav-btn,
    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.9rem 1.5rem;
      font-weight: 600;
      transition: 0.25s ease;
      border: 1px solid transparent;
    }

    .nav-btn,
    .primary-btn {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .nav-btn:hover,
    .primary-btn:hover {
      transform: translateY(-2px);
    }

    .secondary-btn {
      background: transparent;
      border-color: rgba(255,255,255,0.14);
      color: var(--white);
    }

    .hero {
      padding: 90px 0 60px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 50px;
      align-items: center;
    }

    .hero-content h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.08;
      margin-bottom: 12px;
    }

    .hero-content h2 {
      font-size: clamp(1.2rem, 2vw, 2rem);
      color: #dfe7ff;
      margin-bottom: 16px;
    }

    .hero-content p {
      color: var(--muted);
      max-width: 620px;
      font-size: 1.04rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 28px;
    }

    .social-links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 28px;
      color: var(--muted);
    }

    .social-links a {
      border-bottom: 1px solid transparent;
    }

    .social-links a:hover {
      color: var(--white);
      border-color: var(--primary-2);
    }

    .hero-card {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124,58,237,0.18), rgba(17,24,39,0.8));
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: var(--white);
      font-size: 2.2rem;
      font-weight: 800;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .stats div {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 12px;
      text-align: center;
    }

    .stats strong {
      display: block;
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .stats span {
      color: var(--muted);
      font-size: 0.74rem;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 36px;
      align-items: center;
    }

    .about-text p {
      color: var(--muted);
      font-size: 1.04rem;
      margin-bottom: 20px;
    }

    .about-boxes {
      display: grid;
      gap: 18px;
    }

    .mini-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
    }

    .mini-card span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .mini-card strong {
      font-size: 1.2rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .project-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      border-color: rgba(124,58,237,0.6);
    }

    .project-image {
      height: 220px;
      background-size: cover;
      background-position: center;
    }

    .project-one {
      background:
        linear-gradient(135deg, rgba(124,58,237,0.7), rgba(34,197,94,0.5)),
        url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80");
    }

    .project-two {
      background:
        linear-gradient(135deg, rgba(29,78,216,0.72), rgba(168,85,247,0.58)),
        url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80");
    }
